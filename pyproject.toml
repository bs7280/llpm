[project]
name = "llpm"
version = "0.1.0"
description = "Markdown-based project management CLI for LLM multi-agent workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

# The core install stays pyyaml-only: `llpm serve` and `llpm.api` are the only
# things that need these, and they say so when the extra is missing.
[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
llpm = "llpm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llpm"]

[dependency-groups]
# httpx is what fastapi's TestClient drives the router with.
dev = ["pytest>=8.0", "fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
